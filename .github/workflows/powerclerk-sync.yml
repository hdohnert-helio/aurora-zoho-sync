name: PowerClerk sync

# Cron enabled 2026-09-17, moved to midday 2026-09-18. 13:00 ET nominal
# (1:00 PM) -- deliberately NOT off-hours anymore, so this WILL evict
# whoever is logged into PowerClerk during the workday (see CLAUDE.md).
# Runs exactly 1 hour before powerclerk-notify.yml's cron -- the scrape
# takes ~10 minutes, and the notifier must not read mid-sync data.

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: scrape + compute, diff against current Zoho values, write nothing'
        type: boolean
        default: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Load PowerClerk + Zoho credentials from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          PC_USER: op://Helio Automation/PowerClerk UI/username
          PC_PASS: op://Helio Automation/PowerClerk UI/password
          ZOHO_CLIENT_ID: op://Helio Automation/Zoho API/ZOHO_CLIENT_ID
          ZOHO_CLIENT_SECRET: op://Helio Automation/Zoho API/ZOHO_CLIENT_SECRET
          ZOHO_REFRESH_TOKEN: op://Helio Automation/Zoho API/ZOHO_REFRESH_TOKEN

      - name: Run sync
        timeout-minutes: 15
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python -u scripts/powerclerk_sync.py "${ARGS[@]}"
