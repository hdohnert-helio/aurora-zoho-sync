<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Helio Canvass Map</title>
<style>
  :root { --bg:#f6f7f4; --card:#fff; --ink:#1d2320; --muted:#5c6660; --accent:#e8892b; --line:#d9ddd6; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141816; --card:#1e2421; --ink:#e9ece8; --muted:#a2aba5; --line:#333b37; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:16px; }
  form { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 22px; width:100%; max-width:340px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p { margin:0 0 20px; color:var(--muted); font-size:14px; }
  input { width:100%; font-size:17px; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
  button { width:100%; margin-top:14px; font-size:17px; font-weight:600; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; }
  .err { color:var(--bad); font-size:14px; margin-top:10px; min-height:1em; }
</style>
</head>
<body>
<form method="post" action="/canvass/login">
  <h1>Canvass map</h1>
  <p>Helio Solar installs, grouped into walkable zones.</p>
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
  <button type="submit">Sign in</button>
  <div class="err">{{error}}</div>
</form>
</body>
</html>
