<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Helio Canvass Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
  :root { --bg:#f6f7f4; --card:#fff; --ink:#1d2320; --muted:#5c6660; --line:#d9ddd6; --accent:#e8892b; --accent-ink:#fff;
          --chip:#eef0ec; --z1:#fde0b8; --z2:#f6b26b; --z3:#e8892b; --z4:#b8560f; --pin:#1f6f5c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141816; --card:#1e2421; --ink:#e9ece8; --muted:#a2aba5; --line:#333b37; --chip:#2a312d; } }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
               font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position:fixed; top:0; left:0; right:0; z-index:1000; display:flex; align-items:center; gap:8px;
           padding:calc(8px + env(safe-area-inset-top)) 12px 8px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  button, select, input, textarea { font:inherit; color:inherit; }
  .btn { border:1px solid var(--line); background:var(--card); border-radius:9px; padding:7px 11px; min-height:38px;
         color:var(--ink); text-decoration:none; display:inline-flex; align-items:center; }
  .btn.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  #map { position:fixed; top:var(--hdr,56px); left:0; right:0; bottom:0; }
  #list { position:fixed; top:var(--hdr,56px); left:0; right:0; bottom:0; overflow:auto; padding:12px 16px 40px; display:none; }
  .fab { position:fixed; right:12px; z-index:900; width:46px; height:46px; border-radius:50%; border:1px solid var(--line);
         background:var(--card); font-size:20px; box-shadow:0 2px 8px rgba(0,0,0,.2); }
  #locate { bottom:calc(24px + env(safe-area-inset-bottom)); }
  #layers { bottom:calc(80px + env(safe-area-inset-bottom)); font-size:13px; font-weight:600; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:1100; background:var(--card); border-top:1px solid var(--line);
           border-radius:16px 16px 0 0; max-height:72vh; overflow:auto; padding:14px 16px calc(18px + env(safe-area-inset-bottom));
           box-shadow:0 -4px 20px rgba(0,0,0,.18); display:none; }
  .sheet.open { display:block; }
  .sheet h2 { margin:0 0 2px; font-size:18px; }
  .sheet .close { float:right; border:0; background:none; font-size:22px; line-height:1; padding:2px 6px; color:var(--muted); }
  .meta { color:var(--muted); font-size:13px; }
  .stats { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  .stat { background:var(--chip); border-radius:9px; padding:6px 10px; font-size:13px; }
  .stat b { display:block; font-size:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  ul.plain { margin:6px 0; padding-left:18px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  select, input[type=text], textarea { width:100%; padding:9px; border:1px solid var(--line); border-radius:9px; background:var(--bg); }
  textarea { min-height:70px; resize:vertical; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .card h3 { margin:0; font-size:16px; display:flex; justify-content:space-between; gap:8px; }
  .score { background:var(--accent); color:var(--accent-ink); border-radius:8px; padding:1px 8px; font-size:13px; }
  .est { color:var(--muted); font-style:italic; }
  .banner { position:fixed; top:calc(var(--hdr,56px) + 8px); left:50%; transform:translateX(-50%); z-index:1000;
            background:var(--card); border:1px solid var(--line); border-radius:9px; padding:6px 12px; font-size:13px; display:none; }
  table.review { width:100%; border-collapse:collapse; font-size:13px; }
  table.review td { border-top:1px solid var(--line); padding:5px 4px; vertical-align:top; }
  .legend { background:var(--card); color:var(--ink); padding:6px 8px; border-radius:8px; font-size:12px; line-height:1.6; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .leaflet-container { background:var(--bg); }
  /* Walk sheet (print) mode */
  body.print header, body.print .fab, body.print #list { display:none !important; }
  body.print #map { position:relative; top:0; height:420px; }
  #printsheet { display:none; padding:16px; }
  body.print #printsheet { display:block; }
  @media print { body.print #map { height:380px; } .noprint { display:none; } }
</style>
</head>
<body>
<header id="hdr">
  <h1>Canvass map</h1>
  <button class="btn" id="viewBtn">List</button>
  <button class="btn" id="filterBtn">Filter</button>
  <button class="btn" id="menuBtn" aria-label="Menu">&#8942;</button>
</header>
<div id="map"></div>
<div id="list"></div>
<div class="banner" id="banner"></div>
<button class="fab" id="layers" title="Satellite / street">SAT</button>
<button class="fab" id="locate" title="My location">&#9678;</button>
<div class="sheet" id="sheet"></div>
<div id="printsheet"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
const ROLE = "{{role}}";
const params = new URLSearchParams(location.search);
const PRINT_ZONE = params.get("sheet");
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let DATA = null, me = null, meMarker = null, view = "map", sortBy = "score";
const filters = loadFilters();

function loadFilters() {
  const def = { town: "", months: "all", minSize: 1, utility: "" };
  try { return Object.assign(def, JSON.parse(localStorage.getItem("canvassFilters") || "{}")); } catch { return def; }
}
function saveFilters() { try { localStorage.setItem("canvassFilters", JSON.stringify(filters)); } catch {} }

// ---------- map ----------
document.documentElement.style.setProperty("--hdr", $("#hdr").offsetHeight + "px");
const map = L.map("map", { zoomControl: false, preferCanvas: true }).setView([41.6, -72.7], 9);
L.control.zoom({ position: "topleft" }).addTo(map);
const street = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  { maxZoom: 19, attribution: "Imagery &copy; Esri" });
$("#layers").onclick = () => {
  if (map.hasLayer(sat)) { map.removeLayer(sat); street.addTo(map); $("#layers").textContent = "SAT"; }
  else { map.removeLayer(street); sat.addTo(map); $("#layers").textContent = "MAP"; }
};

const townLayer = L.geoJSON(null, { style: townStyle, onEachFeature: (f, l) => l.on("click", () => openTown(f.properties.town)) }).addTo(map);
const zoneLayer = L.geoJSON(null, { style: zoneStyle, onEachFeature: (f, l) => l.on("click", (e) => { L.DomEvent.stop(e); openZone(f.properties.id); }) }).addTo(map);
const pins = L.markerClusterGroup({ maxClusterRadius: 40, disableClusteringAtZoom: 16, showCoverageOnHover: false }).addTo(map);

function townStyle(f) {
  const n = visibleTownCounts()[f.properties.town] || 0;
  const fill = n === 0 ? "transparent" : n < 3 ? "#cfe3dc" : n < 8 ? "#8fc2b0" : n < 15 ? "#4f9a83" : "#1f6f5c";
  // Choropleth is the zoomed-out "which town" view; fade it at street level so it doesn't tint the map.
  return { color: "#6b7a72", weight: 1, fillColor: fill, fillOpacity: n ? (map.getZoom() >= 13 ? 0.06 : 0.35) : 0 };
}
map.on("zoomend", () => townLayer.setStyle(townStyle));
let scoreBreaks = [0, 0, 0];
function zoneStyle(f) {
  const s = f.properties.score;
  const c = s >= scoreBreaks[2] ? "var(--z4)" : s >= scoreBreaks[1] ? "var(--z3)" : s >= scoreBreaks[0] ? "var(--z2)" : "var(--z1)";
  const css = getComputedStyle(document.documentElement);
  const col = css.getPropertyValue(c.slice(4, -1)).trim();
  return { color: col, weight: 2, fillColor: col, fillOpacity: 0.3 };
}

// ---------- filtering ----------
function cutoffDate() {
  if (filters.months === "all") return null;
  const d = new Date(); d.setMonth(d.getMonth() - Number(filters.months)); return d.toISOString().slice(0, 10);
}
function installVisible(i) {
  const cut = cutoffDate();
  if (cut && (!i.date || i.date < cut)) return false;
  if (filters.town && i.town !== filters.town) return false;
  if (filters.utility && i.utility !== filters.utility) return false;
  return true;
}
function visibleInstalls() { return DATA.installs.filter(installVisible); }
function visibleTownCounts() {
  const c = {}; if (!DATA) return c;
  for (const i of visibleInstalls()) c[i.town] = (c[i.town] || 0) + 1; return c;
}
function visibleZones() {
  const counts = {};
  for (const i of visibleInstalls()) counts[i.zone] = (counts[i.zone] || 0) + 1;
  return DATA.zones.filter(z => (counts[z.id] || 0) >= Math.max(1, Number(filters.minSize)))
    .map(z => Object.assign({}, z, { shown: counts[z.id] }));
}

function render() {
  const zones = visibleZones();
  const scores = zones.map(z => z.score).sort((a, b) => a - b);
  const q = (p) => scores.length ? scores[Math.floor(p * (scores.length - 1))] : 0;
  scoreBreaks = [q(0.25), q(0.5), q(0.8)];
  townLayer.clearLayers().addData(DATA.towns);
  zoneLayer.clearLayers().addData({ type: "FeatureCollection",
    features: zones.map(z => ({ type: "Feature", properties: { id: z.id, score: z.score }, geometry: z.geometry })) });
  pins.clearLayers();
  for (const i of visibleInstalls()) {
    const m = L.circleMarker([i.lat, i.lng], { radius: 6, color: "#fff", weight: 1.5, fillColor: "#1f6f5c", fillOpacity: 0.95 });
    m.bindPopup(`<b>${esc(i.address)}</b><br>${esc(i.month || "date unknown")}${i.estimated ? ' <span class="est">(est.)</span>' : ""}<br>${esc(i.utility || "")}`);
    pins.addLayer(m);
  }
  $("#filterBtn").classList.toggle("on", !!(filters.town || filters.utility || filters.months !== "all" || Number(filters.minSize) > 1));
  if (view === "list") renderList();
}

// ---------- panels ----------
function openSheet(html) { $("#sheet").innerHTML = html; $("#sheet").classList.add("open"); $("#sheet").scrollTop = 0; }
function closeSheet() { $("#sheet").classList.remove("open"); }
document.addEventListener("click", (e) => { if (e.target.matches(".close")) closeSheet(); });

function fmtDate(d) { return d ? new Date(d + "T12:00").toLocaleDateString(undefined, { month: "short", year: "numeric" }) : "unknown"; }
function navLinks(lat, lng) {
  return `<a class="btn primary" href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}" target="_blank" rel="noopener">Google Maps</a>
          <a class="btn" href="https://maps.apple.com/?daddr=${lat},${lng}" target="_blank" rel="noopener">Apple Maps</a>`;
}

function openZone(id) {
  const z = DATA.zones.find(z => z.id === id); if (!z) return;
  const members = visibleInstalls().filter(i => i.zone === id).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const streets = {};
  for (const m of members) (streets[m.street] = streets[m.street] || []).push(m);
  openSheet(`<button class="close" aria-label="Close">&times;</button>
    <h2>Zone ${esc(z.id)}</h2>
    <div class="meta">${esc(z.town)} &middot; ${esc(z.utility || "utility unknown")} &middot; ${z.kind === "seed" ? "seed (single install)" : "cluster"}</div>
    <div class="stats">
      <div class="stat"><b>${members.length}</b>installs${members.length !== z.count ? ` (of ${z.count})` : ""}</div>
      <div class="stat"><b>${fmtDate(z.latest)}</b>most recent</div>
      <div class="stat"><b>${z.score}</b>score</div>
    </div>
    <div class="row">${navLinks(z.center[0], z.center[1])}
      <a class="btn" href="/canvass?sheet=${encodeURIComponent(z.id)}" target="_blank">Walk sheet</a>
      <button class="btn" onclick="openTown('${esc(z.town)}')">Town notes</button></div>
    <label>Streets with installs</label>
    <ul class="plain">${Object.entries(streets).map(([s, ms]) =>
      `<li><b>${esc(s)}</b> &mdash; ${ms.map(m => `${esc(m.address.split(",")[0])} <span class="meta">${esc(m.month || "")}${m.estimated ? " est." : ""}</span>`).join("; ")}</li>`).join("")}</ul>`);
  // Keep the zone in the part of the map the bottom sheet doesn't cover.
  map.fitBounds(L.geoJSON(z.geometry).getBounds(),
    { paddingTopLeft: [20, 20], paddingBottomRight: [20, $("#sheet").offsetHeight + 20], maxZoom: 16 });
}

function openTown(town) {
  const n = DATA.notes[town] || {};
  const zones = visibleZones().filter(z => z.town === town);
  const count = visibleTownCounts()[town] || 0;
  openSheet(`<button class="close" aria-label="Close">&times;</button>
    <h2>${esc(town)}</h2>
    <div class="meta">${count} installs shown &middot; ${zones.length} zones</div>
    <div class="row">${zones.slice(0, 12).map(z => `<button class="btn" onclick="openZone('${z.id}')">${esc(z.id)} &middot; ${z.shown}</button>`).join("")}</div>
    <label for="nPermit">Solicitor / peddler permit</label>
    <textarea id="nPermit" placeholder="e.g. Register with police dept, $25, valid 90 days">${esc(n.permit)}</textarea>
    <label for="nContact">Permit office contact</label>
    <input type="text" id="nContact" value="${esc(n.contact)}" placeholder="Phone, address, hours">
    <label for="nNotes">Other notes</label>
    <textarea id="nNotes">${esc(n.notes)}</textarea>
    <div class="row"><button class="btn primary" onclick="saveNotes('${esc(town)}')">Save notes</button>
      <span class="meta" id="nStatus">${n.updated ? "Last updated " + esc(n.updated) : ""}</span></div>`);
}

async function saveNotes(town) {
  $("#nStatus").textContent = "Saving…";
  const r = await fetch(`/canvass/api/towns/${encodeURIComponent(town)}/notes`, {
    method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
    body: JSON.stringify({ permit: $("#nPermit").value, contact: $("#nContact").value, notes: $("#nNotes").value }) });
  if (r.ok) { DATA.notes[town] = await r.json(); $("#nStatus").textContent = "Saved"; }
  else { $("#nStatus").textContent = "Save failed: " + (await r.json().catch(() => ({}))).detail; }
}

// ---------- filters ----------
$("#filterBtn").onclick = () => {
  const towns = [...new Set(DATA.installs.map(i => i.town))].sort();
  openSheet(`<button class="close" aria-label="Close">&times;</button><h2>Filter</h2>
    <label for="fTown">Town</label><select id="fTown"><option value="">All towns</option>${towns.map(t => `<option ${t === filters.town ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
    <label for="fMonths">Installed within</label><select id="fMonths">
      ${[["6","Last 6 months"],["12","Last 12 months"],["24","Last 24 months"],["all","All time"]].map(([v,l]) => `<option value="${v}" ${v === filters.months ? "selected" : ""}>${l}</option>`).join("")}</select>
    <label for="fMin">Minimum zone size</label><select id="fMin">${[1,2,3,5].map(v => `<option ${v == filters.minSize ? "selected" : ""}>${v}</option>`).join("")}</select>
    <label for="fUtil">Utility</label><select id="fUtil">
      ${[["","Any"],["Eversource","Eversource"],["UI","United Illuminating"]].map(([v,l]) => `<option value="${v}" ${v === filters.utility ? "selected" : ""}>${l}</option>`).join("")}</select>
    <div class="row"><button class="btn primary" id="fApply">Apply</button><button class="btn" id="fReset">Reset</button></div>
    <p class="meta">Dates marked "est." are estimated from the sale date plus the typical ${DATA.lag_days}-day gap to install.</p>`);
  $("#fApply").onclick = () => {
    Object.assign(filters, { town: $("#fTown").value, months: $("#fMonths").value, minSize: $("#fMin").value, utility: $("#fUtil").value });
    saveFilters(); closeSheet(); render();
    if (filters.town) { const t = DATA.towns.features.find(f => f.properties.town === filters.town); if (t) map.fitBounds(L.geoJSON(t).getBounds()); }
  };
  $("#fReset").onclick = () => { Object.assign(filters, { town: "", months: "all", minSize: 1, utility: "" }); saveFilters(); closeSheet(); render(); };
};

// ---------- list view ----------
$("#viewBtn").onclick = () => {
  view = view === "map" ? "list" : "map";
  $("#viewBtn").textContent = view === "map" ? "List" : "Map";
  $("#list").style.display = view === "list" ? "block" : "none";
  for (const id of ["#map", "#locate", "#layers"]) $(id).style.visibility = view === "list" ? "hidden" : "visible";
  if (view === "list") renderList(); else map.invalidateSize();
};
function renderList() {
  let zones = visibleZones();
  if (sortBy === "distance" && me) zones.forEach(z => z.dist = haversine(me, z.center)), zones.sort((a, b) => a.dist - b.dist);
  else zones.sort((a, b) => b.score - a.score);
  $("#list").innerHTML = `<div class="row">
      <button class="btn ${sortBy === "score" ? "on" : ""}" onclick="sortBy='score';renderList()">By score</button>
      <button class="btn ${sortBy === "distance" ? "on" : ""}" onclick="sortByDistance()">Nearest to me</button>
      <span class="meta" style="align-self:center">${zones.length} zones</span></div>` +
    zones.map(z => `<div class="card" onclick="showZoneFromList('${z.id}')">
      <h3><span>${esc(z.town)} &middot; ${esc(z.id)}</span><span class="score">${z.score}</span></h3>
      <div class="meta">${z.shown} installs &middot; latest ${fmtDate(z.latest)} &middot; ${esc(z.utility || "")}${z.dist != null ? ` &middot; ${z.dist.toFixed(1)} mi` : ""}</div>
      <div class="meta">${esc(z.streets.slice(0, 4).join(", "))}${z.streets.length > 4 ? "…" : ""}</div></div>`).join("");
}
function showZoneFromList(id) { $("#viewBtn").click(); openZone(id); }
function sortByDistance() { sortBy = "distance"; if (!me) locate(() => renderList()); else renderList(); }
function haversine(a, b) {
  const r = 3958.8, t = Math.PI / 180, dLat = (b[0] - a[0]) * t, dLng = (b[1] - a[1]) * t;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * t) * Math.cos(b[0] * t) * Math.sin(dLng / 2) ** 2;
  return 2 * r * Math.asin(Math.sqrt(h));
}

// ---------- GPS ----------
let watching = false;
function locate(cb) {
  if (!navigator.geolocation) return banner("Location isn't available on this device");
  if (watching) { if (me) map.setView(me, 16); cb && cb(); return; }
  watching = true;
  navigator.geolocation.watchPosition((p) => {
    const first = !me; me = [p.coords.latitude, p.coords.longitude];
    if (!meMarker) meMarker = L.circleMarker(me, { radius: 8, color: "#fff", weight: 3, fillColor: "#2a7de1", fillOpacity: 1 }).addTo(map);
    else meMarker.setLatLng(me);
    if (first) { map.setView(me, 16); cb && cb(); }
  }, () => { watching = false; banner("Couldn't get your location. Check location permission."); }, { enableHighAccuracy: true, maximumAge: 15000 });
}
$("#locate").onclick = () => locate();

function banner(msg, ms = 4000) { const b = $("#banner"); b.textContent = msg; b.style.display = "block"; clearTimeout(b._t); if (ms) b._t = setTimeout(() => b.style.display = "none", ms); }

// ---------- menu ----------
$("#menuBtn").onclick = () => {
  openSheet(`<button class="close" aria-label="Close">&times;</button><h2>Menu</h2>
    <p class="meta">Data synced from Zoho ${esc(new Date(DATA.synced_at).toLocaleString())}.<br>
    ${DATA.installs.length} installs on the map in ${DATA.zones.length} zones.</p>
    <div class="row">${ROLE === "admin" ? `<button class="btn primary" onclick="refreshNow()">Refresh from Zoho now</button><button class="btn" onclick="showReview()">Review queue</button>` : ""}
    <a class="btn" href="/canvass/logout">Sign out</a></div><div id="adminOut"></div>`);
};
async function refreshNow() {
  const r = await fetch("/canvass/api/refresh", { method: "POST", credentials: "same-origin" });
  $("#adminOut").innerHTML = `<p class="meta">${r.ok ? "Sync started. Reload in a minute or two." : "Couldn't start sync."}</p>`;
}
async function showReview() {
  const r = await fetch("/canvass/api/admin", { credentials: "same-origin" });
  const d = await r.json();
  const last = d.runs[0];
  $("#adminOut").innerHTML = `<p class="meta">Last run: ${last ? esc(`${last.at} UTC, ${last.status}, ${last.on_map ?? "?"} on map, ${last.review ?? "?"} for review, geocoded ${last.geocoded ?? 0}${last.error ? ", " + last.error : ""}`) : "none yet"}</p>
    <table class="review">${d.review.map(x => `<tr><td>${esc(x.issue)}</td><td>${esc(x.address)}<div class="meta">${esc(x.stage)} ${esc(x.detail)} &middot; ${esc(x.id)}</div></td></tr>`).join("")}</table>`;
}

// ---------- walk sheet ----------
function renderPrint(id) {
  document.body.classList.add("print");
  const z = DATA.zones.find(z => z.id === id);
  if (!z) { $("#printsheet").textContent = "Zone not found. It may have changed after the last sync."; return; }
  const members = DATA.installs.filter(i => i.zone === id);
  const streets = {};
  for (const m of members) (streets[m.street] = streets[m.street] || []).push(m);
  map.invalidateSize();
  map.fitBounds(L.geoJSON(z.geometry).getBounds(), { padding: [10, 10] });
  $("#printsheet").innerHTML = `<h2 style="margin:0">Zone ${esc(z.id)} &middot; ${esc(z.town)}</h2>
    <div class="meta">${z.count} installs &middot; most recent ${fmtDate(z.latest)} &middot; ${esc(z.utility || "")} &middot; printed ${new Date().toLocaleDateString()}</div>
    <h3>Streets</h3><ul class="plain">${Object.entries(streets).sort().map(([s, ms]) =>
      `<li><b>${esc(s)}</b>: ${ms.map(m => esc(m.address.split(",")[0]) + ` (${esc(m.month || "?")}${m.estimated ? " est." : ""})`).join(", ")}</li>`).join("")}</ul>
    <h3>Town notes</h3><p>${esc((DATA.notes[z.town] || {}).permit || "No permit notes yet.")}</p>
    <button class="btn primary noprint" onclick="print()">Print</button>`;
}

// ---------- load ----------
async function load() {
  const r = await fetch("/canvass/api/data", { credentials: "same-origin" });
  if (r.status === 401) return location.reload();
  if (r.status === 503) { banner("Map data is loading after a restart, retrying…", 0); return setTimeout(load, 8000); }
  DATA = await r.json();
  $("#banner").style.display = "none";
  render();
  if (PRINT_ZONE) return renderPrint(PRINT_ZONE);
  if (DATA.installs.length) map.fitBounds(L.latLngBounds(DATA.installs.map(i => [i.lat, i.lng])), { padding: [20, 20] });
  const legend = L.control({ position: "bottomleft" });
  legend.onAdd = () => { const d = L.DomUtil.create("div", "legend");
    d.innerHTML = `<i style="background:var(--z4)"></i>Top zones<br><i style="background:var(--z2)"></i>Lower score<br><i style="background:#1f6f5c;border-radius:50%"></i>Install`; return d; };
  legend.addTo(map);
}
load();
</script>
</body>
</html>
